name: Build and publish documentation to GitHub Pages

# The site is the redirect page at the repository root, the assets folder
# and the TypeDoc API reference, served under /docs/ as it always has been.

on:
  # Runs on pushes targeting the working branch
  push:
    branches: [main]

  # Allows manual runs from the Actions tab
  workflow_dispatch:

# Permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; do not cancel in-progress runs
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Generate the TypeDoc API reference (docs/dist)
        run: npm run docs

      - name: Assemble the site
        run: |
          mkdir -p site
          cp index.html site/
          cp -r assets site/assets
          cp -r docs/dist site/docs
          ls -R site | head -40

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
